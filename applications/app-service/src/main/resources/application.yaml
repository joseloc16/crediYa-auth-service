server:
  port: 8080
spring:
  application:
    name: "Auth-Service"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

routes:
  paths:
    users: "/api/v1/usuarios"
    usersById: "/api/v1/usuarios/{id}"
    usersExists: "/api/v1/usuarios/exists"

adapters:
  r2dbc:
    host: "localhost"
    port: 5432
    database: "crediya-db"
    schema: "public"
    username: "joseloc"
    password: "crediya"
