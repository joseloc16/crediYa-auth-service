server:
  port: 8016
spring:
  application:
    name: "Auth-Service"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

routes:
  paths:
    user: "/api/v1/usuarios"
    #userByEmail: "/api/v1/usuarios/exists/{email}"

adapters:
  r2dbc:
    host: "localhost"
    port: 5432
    database: "credi-auth"
    schema: "public"
    username: "joseloc"
    password: "crediya"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    co.com.bancolombia: DEBUG
    org.springframework.web: INFO
    org.springframework.r2dbc.core: DEBUG     # queries de DatabaseClient
    io.r2dbc.postgresql.QUERY: INFO           # SQL del driver
    io.r2dbc.postgresql.PARAM: DEBUG          # parámetros (usa con cuidado)

jwt:
  secret: "ZGlhbmFkaWFuYWRpYW5hZGlhbmFkaWFuYWRpYW5hZGlhbmFkaWFuYWRpYW5hZGlhbmFkaWFuYQ=="
  expiration: "300000"