server:
  port: 8080
spring:
  application:
    name: "Auth-Service"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

adapters:
  r2dbc:
    host: "localhost"
    port: 5433
    database: "crediYaDB"
    schema: "public"
    username: ${R2DBC_USERNAME}
    password: ${R2DBC_PASS}
